#############
## Project ##
#############

name:
  help: "Human-readable name of the project"
  type: str

slug:
  help: "Slug name of the project"
  type: str
  default: "{{ name|lower|replace(' ', '-') }}"

owner:
  help: "Owner or copyright holder of the project"
  type: str

## type: library, app, webapp?


#############
## License ##
#############

license:
  help: "License (For help picking one: https://choosealicense.com/)"
  type: str
  # Licenses from:
  # - https://choosealicense.com/appendix/
  choices:
    - None
    - GNU General Public License (GPL) 3.0
    - GNU General Public License (GPL) 2.0
    - GNU Lesser General Public License (LGPL) 3.0
    - GNU Lesser General Public License (LGPL) 2.1
    - GNU Affero General Public License (AGPL) 3.0
    - GNU Free Documentation License (GFDL) 1.3
    - Creative Commons Attribution (CC-BY) 4.0 International
    - Creative Commons Attribution Share Alike (CC-BY-SA) 4.0 International
    - Creative Commons Attribution Non Commercial (CC-BY-NC) 4.0 International
    - Creative Commons Attribution No Derivatives (CC-BY-ND) 4.0 International
    - Creative Commons Attribution Non Commercial (CC-BY-NC-SA) Share Alike 4.0 International
    - Creative Commons Attribution Non Commercial No Derivatives (CC-BY-NC-ND) 4.0 International
    - Creative Commons Zero (CC0) v1.0 Universal
    - MIT License
    - Apache License 2.0
    - Eclipse Public License (EPL) 2.0
    - Mozilla Public License (MPL) 2.0
    - BSD 2-Clause "Simplified" License
    - BSD 3-Clause "New" or "Revised" License
    - Boost Software License (BSL) 1.0
    - The Unlicense

license_id:
  help: "License SPDX ID"
  type: str
  when: false
  choices:
    # https://spdx.org/licenses/
    - None
    - GPL-3.0-or-later
    - GPL-2.0-or-later
    - LGPL-3.0-or-later
    - LGPL-2.1-or-later
    - AGPL-3.0-or-later
    - GFDL-1.3-or-later
    - CC-BY-4.0
    - CC-BY-SA-4.0
    - CC-BY-NC-4.0
    - CC-BY-ND-4.0
    - CC-BY-NC-SA-4.0
    - CC-BY-NC-ND-4.0
    - CC0-1.0
    - MIT
    - Apache-2.0
    - EPL-2.0
    - MPL-2.0
    - BSD-2-Clause
    - BSD-3-Clause
    - BSL-1.0
    - Unlicense
  default: |-
    {%-   if license == 'None' -%}
      None
    {%- elif license == 'GNU General Public License (GPL) 3.0' -%}
      GPL-3.0-or-later
    {%- elif license == 'GNU General Public License (GPL) 2.0' -%}
      GPL-2.0-or-later
    {%- elif license == 'GNU Lesser General Public License (LGPL) 3.0' -%}
      LGPL-3.0-or-later
    {%- elif license == 'GNU Lesser General Public License (LGPL) 2.1' -%}
      LGPL-2.1-or-later
    {%- elif license == 'GNU Affero General Public License (AGPL) 3.0' -%}
      AGPL-3.0-or-later
    {%- elif license == 'GNU Free Documentation License (GFDL) 1.3' -%}
      GFDL-1.3-or-later
    {%- elif license == 'Creative Commons Attribution (CC-BY) 4.0 International' -%}
      CC-BY-4.0
    {%- elif license == 'Creative Commons Attribution Share Alike (CC-BY-SA) 4.0 International' -%}
      CC-BY-SA-4.0
    {%- elif license == 'Creative Commons Attribution Non Commercial (CC-BY-NC) 4.0 International' -%}
      CC-BY-NC-4.0
    {%- elif license == 'Creative Commons Attribution No Derivatives (CC-BY-ND) 4.0 International' -%}
      CC-BY-ND-4.0
    {%- elif license == 'Creative Commons Attribution Non Commercial (CC-BY-NC-SA) Share Alike 4.0 International' -%}
      CC-BY-NC-SA-4.0
    {%- elif license == 'Creative Commons Attribution Non Commercial No Derivatives (CC-BY-NC-ND) 4.0 International' -%}
      CC-BY-NC-ND-4.0
    {%- elif license == 'Creative Commons Zero (CC0) v1.0 Universal' -%}
      CC0-1.0
    {%- elif license == 'MIT License' -%}
      MIT
    {%- elif license == 'Apache License 2.0' -%}
      Apache-2.0
    {%- elif license == 'Eclipse Public License (EPL) 2.0' -%}
      EPL-2.0
    {%- elif license == 'Mozilla Public License (MPL) 2.0' -%}
      MPL-2.0
    {%- elif license == 'BSD 2-Clause "Simplified" License' -%}
      BSD-2-Clause
    {%- elif license == 'BSD 3-Clause "New" or "Revised" License' -%}
      BSD-3-Clause
    {%- elif license == 'Boost Software License (BSL) 1.0' -%}
      BSL-1.0
    {%- elif license == 'The Unlicense' -%}
      Unlicense
    {%- endif -%}

license_file_format:
  help: "Format of license file"
  type: str
  choices:
    - Markdown
    - Plain text
    - None
  default: Markdown

license_badge:
  help: "License badge image URL"
  type: str
  when: false
  default: |-
    {%-   if license_id == 'None'              -%} https://img.shields.io/badge/License-None-white.svg
    {%- elif license_id == 'GPL-3.0-or-later'  -%} https://img.shields.io/badge/License-GPL_3.0-blue.svg
    {%- elif license_id == 'GPL-2.0-or-later'  -%} https://img.shields.io/badge/License-GPL_2.0-blue.svg
    {%- elif license_id == 'LGPL-3.0-or-later' -%} https://img.shields.io/badge/License-LGPL_3.0-blue.svg
    {%- elif license_id == 'LGPL-2.1-or-later' -%} https://img.shields.io/badge/License-LGPL_2.1-blue.svg
    {%- elif license_id == 'AGPL-3.0-or-later' -%} https://img.shields.io/badge/License-AGPL_3.0-blue.svg
    {%- elif license_id == 'GFDL-1.3-or-later' -%} https://img.shields.io/badge/License-GFDL_1.3-blue.svg
    {%- elif license_id == 'CC-BY-4.0'         -%} https://img.shields.io/badge/License-CC_BY_4.0-lightgrey.svg
    {%- elif license_id == 'CC-BY-SA-4.0'      -%} https://img.shields.io/badge/License-CC_BY--SA_4.0-lightgrey.svg
    {%- elif license_id == 'CC-BY-NC-4.0'      -%} https://img.shields.io/badge/License-CC_BY--NC_4.0-lightgrey.svg
    {%- elif license_id == 'CC-BY-ND-4.0'      -%} https://img.shields.io/badge/License-CC_BY--ND_4.0-lightgrey.svg
    {%- elif license_id == 'CC-BY-NC-SA-4.0'   -%} https://img.shields.io/badge/License-CC_BY--NC--SA_4.0-lightgrey.svg
    {%- elif license_id == 'CC-BY-NC-ND-4.0'   -%} https://img.shields.io/badge/License-CC_BY--NC--ND_4.0-lightgrey.svg
    {%- elif license_id == 'CC0-1.0'           -%} https://img.shields.io/badge/License-CC0_1.0-lightgrey.svg
    {%- elif license_id == 'MIT'               -%} https://img.shields.io/badge/License-MIT-yellow.svg
    {%- elif license_id == 'Apache-2.0'        -%} https://img.shields.io/badge/License-Apache_2.0-blue.svg
    {%- elif license_id == 'EPL-2.0'           -%} https://img.shields.io/badge/License-EPL_2.0-yellow.svg
    {%- elif license_id == 'MPL-2.0'           -%} https://img.shields.io/badge/License-MPL_2.0-brightgreen.svg
    {%- elif license_id == 'BSD-2-Clause'      -%} https://img.shields.io/badge/License-BSD_2--Clause-orange.svg
    {%- elif license_id == 'BSD-3-Clause'      -%} https://img.shields.io/badge/License-BSD_3--Clause-orange.svg
    {%- elif license_id == 'BSL-1.0'           -%} https://img.shields.io/badge/License-Boost_1.0-orange.svg
    {%- elif license_id == 'Unlicense'         -%} https://img.shields.io/badge/License-Unlicense-white.svg
    {%- endif %}

