#####################
## Copier settings ##
#####################

_exclude:
  - "copier.yaml"
  - "copier.yml"
  - "~*"
  - "*.py[co]"
  - "__pycache__"
  - ".git"
  - ".DS_Store"
  - ".svn"
  - ".jj"
  - ".gitignore"
  - "README.md"
  - "flake.lock"
  - "flake.nix"
  - "update-licenses.py"
  - "license.*.md"
  - "license.*.txt"
  - "license.*-summary.md"

_answers_file: .copier-answers-license.yml