  help: "License badge link"
  type: str
  when: false
  default: |-
    {%-   if license_id == 'None'              -%} http://localhost/
    {%- elif license_id == 'GPL-3.0-or-later'  -%} https://www.gnu.org/licenses/gpl-3.0
    {%- elif license_id == 'GPL-2.0-or-later'  -%} https://www.gnu.org/licenses/gpl-2.0
    {%- elif license_id == 'LGPL-3.0-or-later' -%} https://www.gnu.org/licenses/lgpl-3.0
    {%- elif license_id == 'LGPL-2.1-or-later' -%} https://www.gnu.org/licenses/lgpl-2.1
    {%- elif license_id == 'AGPL-3.0-or-later' -%} https://www.gnu.org/licenses/agpl-3.0
    {%- elif license_id == 'GFDL-1.3-or-later' -%} https://www.gnu.org/licenses/fdl-1.3
    {%- elif license_id == 'CC-BY-4.0'         -%} https://creativecommons.org/licenses/by/4.0/
    {%- elif license_id == 'CC-BY-SA-4.0'      -%} https://creativecommons.org/licenses/by-sa/4.0/
    {%- elif license_id == 'CC-BY-NC-4.0'      -%} https://creativecommons.org/licenses/by-nc/4.0/
    {%- elif license_id == 'CC-BY-ND-4.0'      -%} https://creativecommons.org/licenses/by-nd/4.0/
    {%- elif license_id == 'CC-BY-NC-SA-4.0'   -%} https://creativecommons.org/licenses/by-nc-sa/4.0/
    {%- elif license_id == 'CC-BY-NC-ND-4.0'   -%} https://creativecommons.org/licenses/by-nc-nd/4.0/
    {%- elif license_id == 'CC0-1.0'           -%} https://creativecommons.org/publicdomain/zero/1.0/
    {%- elif license_id == 'MIT'               -%} https://opensource.org/licenses/MIT
    {%- elif license_id == 'Apache-2.0'        -%} https://www.apache.org/licenses/LICENSE-2.0
    {%- elif license_id == 'EPL-2.0'           -%} https://www.eclipse.org/legal/epl-2.0/
    {%- elif license_id == 'MPL-2.0'           -%} https://www.mozilla.org/en-US/MPL/2.0/
    {%- elif license_id == 'BSD-2-Clause'      -%} https://opensource.org/license/BSD-2-Clause
    {%- elif license_id == 'BSD-3-Clause'      -%} https://opensource.org/license/BSD-3-Clause
    {%- elif license_id == 'BSL-1.0'           -%} https://www.boost.org/LICENSE_1_0.txt
    {%- elif license_id == 'Unlicense'         -%} https://unlicense.org/
    {%- endif %}

copyright_holder:
  help: "Copyright holder name"
  type: str
  # TODO: owner?

copyright_year:
  help: "Copyright year"
  type: str
  # TODO: current year


#########
## VCS ##
#########

vcs:
  help: "Version control system with the project sources"
  type: str
  choices:
    - GitHub
    - GitLab
    - Other
    - None

vcs_owner:
  help: "Owner name on the VCS (usually your username)"
  type: str
  default: "{{ owner|lower|replace(' ', '-') }}"
  when: "{{ vcs != 'None' }}"

vcs_name:
  help: "Project slug on the VCS"
  type: str
  default: "{{ slug }}"
  when: "{{ vcs != 'None' }}"

vcs_url:
  help: "VCS url"
  type: str
  default: |-
    {%- if vcs == 'GitHub' -%}
      https://github.com/{{vcs_owner}}/{{vcs_name}}
    {%- elif vcs == 'GitLab' -%}
      https://gitlab.com/{{vcs_owner}}/{{vcs_name}}
    {%- endif %}
  when: "{{ vcs != 'None' }}"

